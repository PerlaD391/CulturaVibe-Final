spring.application.name=culturavibe-final
# Puerto del Proyecto Final en el VPS del equipo (Act1 8081, Act2 8083, Act3 8084, Act4 8085).
server.port=8086

# Base de datos MySQL. Las credenciales se pasan con variables de entorno
# para no subirlas al repositorio (DB_URL, DB_USER, DB_PASSWORD).
# La base se crea sola con createDatabaseIfNotExist=true.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/culturavibe_final?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: validate NUNCA crea ni modifica tablas; el esquema lo crea Flyway.
# Si una entidad no coincide con la tabla, la app no arranca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway: las migraciones están en src/main/resources/db/migration/.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Correo: en el VPS corre Postfix en localhost:25 (con SPF/DKIM).
# Si el envío falla, EmailService solo registra un warn y el flujo sigue.
spring.mail.host=localhost
spring.mail.port=25
app.mail.from=${MAIL_FROM:no-reply@culturavibe.mx}
# URL del frontend, usada en el enlace del correo de recuperación de contraseña.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# JWT: el secreto se pasa con la variable JWT_SECRET (Base64URL, 32 bytes).
# Sin JWT_SECRET la app no arranca: nunca debe haber un secreto real en el repo.
# Para generar uno: openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
app.jwt.secreto=${JWT_SECRET:}
# El token dura 24 horas (en milisegundos).
app.jwt.expiracion-ms=86400000

# SMS: Vonage va primero y Twilio queda de respaldo. Vonage tiene prueba
# gratis con número virtual y no exige upgrade para comprar el número
# (Twilio trial sí lo exige). Si no hay ninguno configurado, el SMS se
# omite con un warn y la reserva se crea igual.
app.vonage.api-key=${VONAGE_API_KEY:}
app.vonage.api-secret=${VONAGE_API_SECRET:}
app.vonage.from-number=${VONAGE_FROM_NUMBER:}
app.vonage.api-base-url=${VONAGE_API_BASE_URL:https://rest.nexmo.com}

# Twilio (solo SMS, respaldo si Vonage no está configurado).
# Si alguna variable está vacía, se intenta con Vonage o se omite el SMS.
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# WhatsApp con Meta WhatsApp Cloud API (Graph API v21.0), gratis.
# El token es temporal (dura 24 h) y se pasa con WHATSAPP_ACCESS_TOKEN.
# Si faltan estas variables, el WhatsApp se omite con un warn.
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:hello_world}
app.whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
# Plantilla del código de verificación por WhatsApp: debe existir en
# Meta con una variable {{1}} para el código (por ejemplo, cuerpo
# "Tu código de CulturaVibe es {{1}}. Válido por 15 minutos."). La
# plantilla hello_world no lleva variables, así que el código no se
# puede mandar con ella. Si la plantilla no existe o no está aprobada,
# el envío falla con warn y el código sigue llegando por correo y SMS.
app.whatsapp.template-codigo=${WHATSAPP_TEMPLATE_CODIGO:codigo_verificacion}

# Login con Google (OAuth2). Las credenciales se crean en Google Cloud
# Console (APIs y servicios → Credenciales → ID de cliente de OAuth) y
# se leen directo de las variables GOOGLE_CLIENT_ID y
# GOOGLE_CLIENT_SECRET (sin valor por defecto). Si están vacías, la app
# arranca igual y el botón "Continuar con Google" no funciona.
# La URI de redirección autorizada en Google debe ser:
#   https://culturavibe.duckdns.org/login/oauth2/code/google
# (en local: http://localhost:8086/login/oauth2/code/google).
# Además, Nginx debe pasar /oauth2/ y /login/oauth2/ al backend
# (como ya hace con /api/), o el botón no llega al backend.

# Login con Firebase Auth (Google por Firebase). La ruta del JSON de
# la cuenta de servicio se pasa con FIREBASE_SERVICE_ACCOUNT (ver
# application.properties.example). Si está vacía, la app arranca igual
# y POST /api/auth/firebase responde 503.
app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:}

# CORS: orígenes permitidos, separados por comas. Se puede sobreescribir
# con la variable CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://13.140.226.55,https://13.140.226.55}

logging.level.mx.culturavibe.proyectofinal=INFO
logging.level.org.flywaydb=INFO
