# Perfil de pruebas locales sin MySQL: base H2 en memoria.
# Se usa con: java -cp ... mx.culturavibe.proyectofinal.CulturavibeFinalApplication --spring.profiles.active=test
# En el VPS NO se usa este perfil; ahí corre con MySQL (application.properties).
spring.datasource.url=jdbc:h2:mem:culturavibe_final;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# validate igual que en producción: el esquema lo crea Flyway, no Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Secreto JWT fijo SOLO para desarrollo/pruebas. NO usar en producción:
# en el VPS el secreto se pasa con la variable de entorno JWT_SECRET.
app.jwt.secreto=ucewI6PbmlBPgFRGktWuohG86c11nzFsNduKgHWImW8
app.jwt.expiracion-ms=86400000
spring.mail.host=localhost
spring.mail.port=25
app.mail.from=no-reply@culturavibe.mx
app.frontend.url=http://localhost:5173
# Vonage vacío en pruebas: el SMS se omite con un warn (o se apunta
# a un mock local con VONAGE_API_BASE_URL).
app.vonage.api-key=
app.vonage.api-secret=
app.vonage.from-number=
app.vonage.api-base-url=https://rest.nexmo.com
# Twilio vacío en pruebas: el SMS se omite con un warn.
app.twilio.account-sid=
app.twilio.auth-token=
app.twilio.phone-number=
# WhatsApp Cloud API vacío en pruebas: el WhatsApp se omite con un warn.
app.whatsapp.phone-number-id=
app.whatsapp.access-token=
app.whatsapp.template-name=hello_world
app.whatsapp.api-base-url=https://graph.facebook.com/v21.0
app.cors.allowed-origins=http://localhost:5173
