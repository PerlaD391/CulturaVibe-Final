# culturavibe-nginx.conf — BORRADOR, copiar a /etc/nginx/sites-available/culturavibe
# Uso:
#   scp culturavibe-nginx.conf root@13.140.226.55:/etc/nginx/sites-available/culturavibe
#   sudo ln -s /etc/nginx/sites-available/culturavibe /etc/nginx/sites-enabled/
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d culturavibe.duckdns.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# Por qué el proxy /api: el frontend llama a VITE_API_URL + /api/...; si la API
# quedara en http://13.140.226.55:8086, el navegador la bloquearía por contenido
# mixto al servir el sitio por HTTPS. Con este proxy, VITE_API_URL es
# https://culturavibe.duckdns.org (sin puerto) y todo va por el mismo origen.
# Recuerda agregar https://culturavibe.duckdns.org a CORS_ALLOWED_ORIGINS en el .env.
server {
    listen 80;
    server_name culturavibe.duckdns.org;

    root /var/www/html/culturavibe;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login con Google: el botón va a /oauth2/authorization/google y
    # Google vuelve a /login/oauth2/code/google. Esas rutas no están
    # bajo /api/, así que se pasan al backend igual que /api/.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
